# Sample "syndicate after deploy" pipeline for Gitea Actions - see
# ../../.github/workflows/cloudflare-pages.yml for the GitHub Actions version
# and the full explanation of what each step does and why.
#
# Deploys via the Wrangler CLI directly rather than a marketplace action: a
# plain `run:` step works the same on any runner, without depending on a
# composite/JS action resolving from github.com (see the note on that in
# ../workflows/deploy.yml).
#
# Needs only DEVTO_API_KEY from deploy.yml's secrets (no Cloudinary ones -
# see the syndicate step below), plus two Cloudflare secrets (Settings >
# Actions > Secrets): CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#
# Also needs GIT_PUSH_TOKEN (Settings > Actions > Secrets): a Personal Access
# Token with write access to this repo (Settings > Applications on your
# Gitea profile). Gitea Actions' own auto-token isn't reliably available for
# pushing depending on how the instance is configured, unlike GitHub's - see
# the README's "Persisting sync state in CI" for why the last step needs to
# push at all, and the GitHub Actions version of this file for the
# `permissions: contents: write` equivalent that works there instead.
name: Deploy to Cloudflare Pages, then syndicate

on:
  push:
    branches: [main]

jobs:
  deploy:
    # The "Commit updated syndication state" step below pushes back to main,
    # which would otherwise re-trigger this same workflow on its own commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `file:..`-only, see deploy.yml. Skip in a real project.
      - run: npm ci
      - run: npm run build:lib

      - run: npm install --prefix demo --no-audit --no-fund

      # No DEVTO_API_KEY here on purpose - see the GitHub Actions version's
      # comment on the equivalent step.
      - run: npm run build --prefix demo

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy demo/dist --project-name=astro-syndicate-demo
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Wrangler prints the live *.pages.dev URL straight to this step's
        # log - that's the deploy "visualized" without parsing its output.

      - name: Syndicate to dev.to
        run: npm run syndicate --prefix demo
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          # No Cloudinary secrets here - see the GitHub Actions version's
          # comment on the equivalent step.
          #
          # Every post syncs as a draft unless this is 'true' - see the
          # CRITICAL note on DevToProvider before flipping it on.
          DEVTO_PUBLISHED: 'false'

      # Without this, every deploy re-creates every post - see the README's
      # "Persisting sync state in CI". Rewrites whatever credentials
      # `actions/checkout@v4` set on origin rather than hard-coding this
      # repo's host/path, so this step works unmodified on any Gitea repo.
      - name: Commit updated syndication state
        run: |
          if git diff --quiet -- demo/src/content/blog; then
            echo "nothing to commit"
            exit 0
          fi
          if [ -z "$GIT_PUSH_TOKEN" ]; then
            echo "::error::GIT_PUSH_TOKEN secret is not set - cannot push the syndication commit"
            exit 1
          fi
          git config user.name "gitea-actions"
          git config user.email "gitea-actions@users.noreply.gitea.io"
          git add demo/src/content/blog
          git commit -m "chore(sync): update dev.to sync state [skip ci]"
          auth_url=$(git remote get-url origin | sed -E "s#https://#https://${GIT_PUSH_TOKEN}@#")
          git push "$auth_url" HEAD:main
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GIT_PUSH_TOKEN }}
