# Sample deploy pipeline for a real Astro site using astro-syndicate, for a
# self-hosted Gitea instance with Actions enabled (Settings > Actions).
#
# Gitea Actions runs the same workflow syntax as GitHub Actions, so this file
# is nearly identical to ../.github/workflows/deploy.yml - see that one for
# what each step does. `actions/checkout@v4` and `actions/setup-node@v4`
# resolve straight from github.com by default (`DEFAULT_ACTIONS_URL` in
# app.ini); if your instance has that locked down, point these `uses:` lines
# at Gitea's own mirrors instead, e.g. https://gitea.com/actions/checkout@v4.
#
# This demo depends on the package via `file:..` (it lives in the same repo
# as the package source), hence the extra build step. A real project
# installing `astro-syndicate` from npm would skip straight to `npm ci`.
#
# `astro build` here also runs syndication (via the `syndication()`
# integration in astro.config.mjs), which rewrites synced posts' frontmatter
# on disk - see the README's "Persisting sync state in CI" for why the last
# step below has to commit and push that, and why it needs GIT_PUSH_TOKEN
# (Settings > Actions > Secrets: a Personal Access Token with write access,
# from Settings > Applications on your Gitea profile).
name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    # The "Commit updated syndication state" step below pushes back to main,
    # which would otherwise re-trigger this same workflow on its own commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `file:..`-only: builds the astro-syndicate package this demo consumes.
      # Skip these two steps in a real project.
      - run: npm ci
      - run: npm run build:lib

      - run: npm install --prefix demo --no-audit --no-fund
      - run: npm run build --prefix demo
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          # Every post syncs as a draft unless this is 'true' - see the
          # CRITICAL note on DevToProvider before flipping it on a schedule
          # or anything other than a deliberate, manually triggered deploy.
          DEVTO_PUBLISHED: 'false'

      # Deploy demo/dist/ wherever your host expects it.

      # Without this, every deploy re-creates every post - see the README's
      # "Persisting sync state in CI". Rewrites whatever credentials
      # `actions/checkout@v4` set on origin rather than hard-coding this
      # repo's host/path, so this step works unmodified on any Gitea repo.
      - name: Commit updated syndication state
        run: |
          if git diff --quiet -- demo/src/content/blog; then
            echo "nothing to commit"
            exit 0
          fi
          if [ -z "$GIT_PUSH_TOKEN" ]; then
            echo "::error::GIT_PUSH_TOKEN secret is not set - cannot push the syndication commit"
            exit 1
          fi
          git config user.name "gitea-actions"
          git config user.email "gitea-actions@users.noreply.gitea.io"
          git add demo/src/content/blog
          git commit -m "chore(sync): update dev.to sync state [skip ci]"
          auth_url=$(git remote get-url origin | sed -E "s#https://#https://${GIT_PUSH_TOKEN}@#")
          git push "$auth_url" HEAD:main
        env:
          GIT_PUSH_TOKEN: ${{ secrets.GIT_PUSH_TOKEN }}
