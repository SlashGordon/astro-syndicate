# Sample deploy pipeline for a real Astro site using astro-syndicate.
#
# This demo depends on the package via `file:..` (it lives in the same repo
# as the package source), which is why it builds the library first. A real
# project installing `astro-syndicate` from npm would skip straight to
# `npm ci` against its own package.json - no `build:lib` step needed.
#
# Copy this into your own project's `.github/workflows/`, drop the two
# `file:..`-only steps, and point the build step at your own site.
#
# `astro build` here also runs syndication (via the `syndication()`
# integration in astro.config.mjs), which rewrites synced posts' frontmatter
# on disk - see the README's "Persisting sync state in CI" for why the last
# step below has to commit and push that, and why the job needs
# `permissions: contents: write` to do it.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    # The "Commit updated syndication state" step below pushes back to main,
    # which would otherwise re-trigger this same workflow on its own commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `file:..`-only: builds the astro-syndicate package this demo consumes.
      # Skip these two steps in a real project - `npm ci` there already
      # pulls a published `astro-syndicate` version straight from npm.
      - run: npm ci
      - run: npm run build:lib

      - run: npm install --prefix demo --no-audit --no-fund
      - run: npm run build --prefix demo
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          # Every post syncs as a draft unless this is 'true' - see the
          # CRITICAL note on DevToProvider before flipping it on a schedule
          # or anything other than a deliberate, manually triggered deploy.
          DEVTO_PUBLISHED: 'false'

      # Deploy demo/dist/ wherever your host expects it (Pages, Netlify, a
      # plain `rsync`, ...) - that part is entirely up to your own setup.

      # Without this, every deploy re-creates every post - see the README's
      # "Persisting sync state in CI".
      - name: Commit updated syndication state
        run: |
          if git diff --quiet -- demo/src/content/blog; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add demo/src/content/blog
          git commit -m "chore(sync): update dev.to sync state [skip ci]"
          git push
